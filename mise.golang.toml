[tools]
go = "1.26.2"
"aqua:golangci/golangci-lint" = "2.11.4"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.3.0"
goreleaser = "2.16.0"

[tasks."fmt:golang"]
description = "Format Go code with golangci-lint"
run = "golangci-lint fmt"

[tasks."lint:golang"]
description = "Lint Go with go vet, golangci-lint, and govulncheck"
run = [
  "go vet ./...",
  "golangci-lint run",
  "govulncheck ./...",
]

[tasks."test:golang"]
description = "Run Go tests"
run = "go test ./..."

[tasks."ci:golang"]
description = "Run Go lint and test tasks"
depends = ["lint:golang", "test:golang"]

[tasks."release:check"]
description = "Validate the GoReleaser config"
run = "goreleaser check"

[tasks."release:snapshot"]
description = "Build a local snapshot release without publishing"
run = "goreleaser release --snapshot --clean"

[tasks."release"]
description = "Build and publish a release (requires a git tag and GITHUB_TOKEN)"
run = "goreleaser release --clean"
