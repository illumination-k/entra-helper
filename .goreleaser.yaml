# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: entra-helper

before:
  hooks:
    - go mod tidy

# macOS needs cgo for the keychain-backed token cache (azidentity/cache), so the
# darwin build enables cgo and must run on a macOS runner. linux/windows have a
# pure-Go path and cross-compile with cgo disabled.
builds:
  - id: darwin
    main: .
    binary: entra-helper
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    env:
      - CGO_ENABLED=1
    goos: [darwin]
    goarch: [amd64, arm64]
    overrides:
      - goos: darwin
        goarch: amd64
        env:
          - CGO_ENABLED=1
          - CC=clang -arch x86_64

  - id: linux
    main: .
    binary: entra-helper
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]

  - id: windows
    main: .
    binary: entra-helper
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    env:
      - CGO_ENABLED=0
    goos: [windows]
    goarch: [amd64, arm64]

archives:
  - id: entra-helper
    ids: [darwin, linux, windows]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"

release:
  github:
    owner: illumination-k
    name: entra-helper
  draft: false
  prerelease: auto
