name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    # macOS runner so the darwin build can use cgo (keychain-backed token cache);
    # linux/windows are cross-compiled with cgo disabled in the same run.
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      MISE_ENV: golang
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          # Disable caching on this publishing workflow to avoid cache poisoning.
          cache: false

      - name: Release
        run: mise run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
