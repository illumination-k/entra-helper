name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    # macOS runner so the darwin build can use cgo (keychain-backed token cache);
    # linux/windows are cross-compiled with cgo disabled in the same run.
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      MISE_ENV: golang
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # Disable caching on this publishing workflow to avoid cache poisoning.
          cache: false

      - name: Release
        run: mise run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
